database:
  url_env: ALBUM_MEMORY_DATABASE_URL
  echo: false
embedding:
  model_path: /root/autodl-tmp/vlm/models/BAAI/bge-m3
  model_version: BAAI/bge-m3-local
  dimension: 1024
  device: cpu
  batch_size: 2
  query_prefix: "为这个句子生成表示以用于检索："
llm:
  enabled: false
  base_url_env: ALBUM_MEMORY_LLM_BASE_URL
  api_key_env: ALBUM_MEMORY_LLM_API_KEY
  model_env: ALBUM_MEMORY_LLM_MODEL
processing:
  event_time_gap_hours: 72
  semantic_floor: 0.72
  semantic_strong_floor: 0.82
  min_event_source_reliability: 0.45
  require_subject_compatibility: true
  max_event_candidates: 30
  max_semantic_edges: 6
retrieval:
  vector_candidates_per_grain: 30
  lexical_candidates: 30
  temporal_candidates: 20
  graph_candidate_limit: 100
  ppr_damping: 0.85
  decay_lambda: 0.0019
  retrieval_decay_floor: 0.0
  frequency_eta: 0.15
maintenance:
  strength_threshold: 0.12
  idle_days: 365
  decay_lambda: 0.0019
  frequency_eta: 0.15
privacy:
  default_profile_injection_enabled: false
  blocked_predicates:
    - mental_health_inference
    - health_diagnosis
    - precise_home_address
    - real_time_location
    - personality_inference
